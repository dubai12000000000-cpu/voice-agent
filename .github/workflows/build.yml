name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Project
        run: |
          cat > build.gradle <<'EOG'
          buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:8.1.4'}}
          allprojects{repositories{google();mavenCentral()}}
          EOG
          echo "include ':app'" > settings.gradle
          mkdir -p app/src/main/java/com/voice/agent app/src/main/res/layout
          cat > app/build.gradle <<'EOA'
          plugins{id 'com.android.application'}
          android{namespace 'com.voice.agent';compileSdk 34;defaultConfig{applicationId "com.voice.agent";minSdk 24;targetSdk 34;versionCode 1;versionName "1.0"}}
          dependencies{implementation 'androidx.appcompat:appcompat:1.6.1'}
          EOA
          cat > app/src/main/AndroidManifest.xml <<'EOM'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.RECORD_AUDIO"/><application android:label="Voice Agent"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOM
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Voice Agent Ready"/></LinearLayout>' > app/src/main/res/layout/activity_main.xml
          cat > app/src/main/java/com/voice/agent/MainActivity.java <<'EOJ'
          package com.voice.agent;
          import android.os.Bundle;import android.content.Intent;import android.speech.RecognizerIntent;import androidx.appcompat.app.AppCompatActivity;import java.util.ArrayList;
          public class MainActivity extends AppCompatActivity{
          protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_main);Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);startActivityForResult(i,100);}
          protected void onActivityResult(int r,int res,Intent d){super.onActivityResult(r,res,d);if(r==100&&res==RESULT_OK){ArrayList<String> l=d.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);String s=l.get(0).toLowerCase();if(s.contains("gallery"))startActivity(new Intent(Intent.ACTION_VIEW,android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI));else if(s.contains("youtube")){try{startActivity(getPackageManager().getLaunchIntentForPackage("com.google.android.youtube"));}catch(Exception e){}}else if(s.contains("facebook")){try{startActivity(getPackageManager().getLaunchIntentForPackage("com.facebook.katana"));}catch(Exception e){startActivity(new Intent(Intent.ACTION_VIEW,android.net.Uri.parse("https://facebook.com")));}}}}
          }
          EOJ
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle wrapper --gradle-version 8.5
      - run: chmod +x gradlew &&./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: voice-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
