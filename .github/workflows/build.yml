name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          mkdir -p app/src/main/java/com/voice/agent
          echo "plugins { id 'com.android.application' } android { namespace 'com.voice.agent'; compileSdk 34; defaultConfig { applicationId 'com.voice.agent'; minSdk 24; targetSdk 34 } }" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Voice"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf 'package com.voice.agent; import android.app.Activity; import android.widget.TextView; public class MainActivity extends Activity { protected void onCreate(android.os.Bundle b){ super.onCreate(b); TextView t=new TextView(this); t.setText("Salam Hazro"); setContentView(t);} }' > app/src/main/java/com/voice/agent/MainActivity.java
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
