name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Project
        run: |
          rm -rf app build.gradle settings.gradle gradle
          echo "include ':app'" > settings.gradle
          printf "plugins {\n id 'com.android.application' version '8.2.2' apply false\n id 'org.jetbrains.kotlin.android' version '1.9.22' apply false\n}\n" > build.gradle
          mkdir -p app/src/main/java/com/voice/agent
          mkdir -p app/src/main/res/layout
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.voice.agent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.voice.agent"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application android:allowBackup="true" android:label="Voice Agent" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/voice/agent/MainActivity.kt <<'EOF'
          package com.voice.agent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  findViewById<TextView>(R.id.tvResult).text = "Voice Agent Ready - Hazro!"
                  findViewById<Button>(R.id.btnSpeak).setOnClickListener {
                      findViewById<TextView>(R.id.tvResult).text = "Salam Bhai! APK Ban Gaya!"
                  }
              }
          }
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp">
              <TextView android:id="@+id/tvResult" android:layout_width="match_parent" android:layout_height="wrap_content" android:textSize="20sp" android:text="Loading..."/>
              <Button android:id="@+id/btnSpeak" android:layout_width="match_parent" android:layout_height="60dp" android:text="BOLO" android:layout_marginTop="30dp"/>
          </LinearLayout>
          EOF

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.6' }

      - name: Build
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: voice-agent-apk, path: app/build/outputs/apk/debug/*.apk }
